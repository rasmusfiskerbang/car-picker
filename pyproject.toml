[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-picker"
version = "0.1.0"
description = "Evidence-backed Danish private-leasing catalogue"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = [
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[project.scripts]
car-picker = "car_picker.__main__:main"

[tool.setuptools]
packages = ["car_picker"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN"]

[tool.ruff.lint.per-file-ignores]
# JSON enters these parsing and calculation boundaries as untyped data and is
# narrowed before use.
"car_picker/comparison.py" = ["ANN401"]
"car_picker/fleasing.py" = ["ANN401"]
"car_picker/legal_release.py" = ["ANN401"]
"car_picker/provider_withdrawal.py" = ["ANN401"]
"car_picker/publication.py" = ["ANN401"]
"car_picker/terminalen.py" = ["ANN401"]
# This throwaway HTTP handler must mirror the variadic stdlib constructor.
"prototype/private-comparison/serve.py" = ["ANN002", "ANN003"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["car_picker", "tests"]
