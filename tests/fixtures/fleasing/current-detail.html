<!doctype html>
<html lang="da">
  <body>
    <div class="vehicle-gallery">
      <div class="slider-for">

        <div class="bg-image" style="background-image: url('https://billeder.bilinfo.net/bilinfo/vehicle-two.jpeg?class=S1600X1600')"></div>
        <div class="bg-image" style="background-image: url(https://images.example.test/not-a-provider-image.jpeg)"></div>
      </div>
    </div>

      <img src="/wp-content/plugins/fleasing-bilinfo/includes/Shortcodes/img/icon-telephone.png" alt="Telefon">

      <h3>Volante aut.</h3>
      <div class="vehicle-page-short-specs">

            <li class="clearfix">

            </li>
            <li class="clearfix">
              Restværdi <span class="leasing-list-right">624.750 kr. <small>/ex. moms og afgift</small></span>
            </li>
            <li class="clearfix">
              Leasingperiode <span class="leasing-list-right">12</span>
